[package]
name = "oos-dsp"
version = "0.1.14"
repository = "https://github.com/dekajoule/oos"
edition = "2021"
description = "OOS signal processing: software triggers, measurements, math, signal generators"
license = "GPL-2.0-or-later"

[lib]
name = "oos_dsp"

[dependencies]

# `example`: the decoder of the example protocol module of oos-ui (ui/src/protocols/example.rs) in
# `protocols::MODULES`, at the place of the module in oos-ui's registry. oos-ui turns it on for its tests only (its
# dev-dependency); the program for the scope is built without it.
[features]
example = []

# The tests run optimised a little (docs/adr/process/0040): the tests of updates and pictures take seconds instead
# of minutes. Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1

# The lints allowed for the whole crate, each with its reason (docs/adr/process/0017). The first two are the same in
# every crate; `too_many_arguments` is for the step builders of hal and has not gone here yet (docs/adr/process/0048).
[lints.clippy]
# `!(dt > 0.0)` is meant: it is also true for NaN, and the signal paths rely on that
neg_cmp_op_on_partial_ord = "allow"
# index loops over several buffers of the same length read better than zipped iterators
needless_range_loop = "allow"
# `uart`, `spi` and `modbus_ascii` take the settings of a line one by one, and ui/src/protocols calls them so; the
# line goes when they take one value (docs/adr/process/0048)
too_many_arguments = "allow"
