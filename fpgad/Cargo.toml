[package]
name = "oos-fpgad"
version = "0.1.2"
repository = "https://github.com/deckerjulian/oos"
edition = "2021"
description = "OOS acquisition control for the Rigol DHO800/DHO900 (plan / run one acquisition)"
license = "GPL-2.0-or-later"

[dependencies]
libc = "0.2"
oos-hal = { path = "../hal" }

[profile.release]
lto = true
panic = "abort"
opt-level = 3
