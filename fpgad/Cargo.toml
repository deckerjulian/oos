[package]
name = "oos-fpgad"
version = "0.1.13"
repository = "https://github.com/dekajoule/oos"
edition = "2021"
description = "OOS acquisition control for the Rigol DHO800/DHO900 (plan / run one acquisition)"
license = "GPL-2.0-or-later"

[dependencies]
libc = "0.2"
oos-hal = { path = "../hal" }

[profile.release]
lto = true
panic = "abort"
opt-level = 3

# The tests run optimised a little (docs/adr/process/0040): the tests of updates and pictures take seconds instead
# of minutes. Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1

# The lints allowed for the whole crate, each with its reason (docs/adr/process/0017). The same two in every crate;
# `too_many_arguments` is for the step builders of hal and not allowed here (docs/adr/process/0048).
[lints.clippy]
# `!(dt > 0.0)` is meant: it is also true for NaN, and the signal paths rely on that
neg_cmp_op_on_partial_ord = "allow"
# index loops over several buffers of the same length read better than zipped iterators
needless_range_loop = "allow"
