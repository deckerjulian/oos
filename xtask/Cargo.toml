[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
description = "Host checks of OOS that read Rust source, run by tools/check.sh (docs/adr/process/0020)"
license = "GPL-2.0-or-later"
publish = false

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", features = ["full", "visit"] }

# The lints allowed for the whole crate, each with its reason (docs/adr/process/0017). The same list in every crate.
[lints.clippy]
# `!(dt > 0.0)` is meant: it is also true for NaN, and the signal paths rely on that
neg_cmp_op_on_partial_ord = "allow"
# index loops over several buffers of the same length read better than zipped iterators
needless_range_loop = "allow"
# step builders take the fields of one register; a struct for each would only move the list
too_many_arguments = "allow"
