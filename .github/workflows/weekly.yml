# What is too slow or too rare for every pull request, once a week (issue 68):
#
#   macos      tools/check.sh on macOS: most of the development happens there, CI runs Linux, and a test can pass on
#              one and fail on the other
#   stress     every test five times next to busy processes (tools/stress-tests.sh): a test that depends on how fast
#              the computer is shows here, not in somebody's pull request
#   coverage   how much of each crate the tests run, as a table in the summary of the run; a number to watch, no gate
#   image      the image build, and after it the simulations (tools/check.sh sim), through the workflow Image
#   canary     tools/check.sh with the newest stable Rust instead of the pinned one (rust-toolchain.toml, ADR 0045):
#              a release that the tree does not pass shows here, before anybody bumps the pin
#
# When one of them fails, the last job opens an issue or adds to the one that is open, so it is seen. It also runs
# for a pull request that changes this file or the script, as a test of the workflow itself.
name: Weekly
on:
  schedule:
    - cron: '23 3 * * 6' # Saturday
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/weekly.yml
      - tools/stress-tests.sh
permissions:
  contents: read
concurrency:
  group: weekly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the Rust that rust-toolchain.toml names, with its components and its target (ADR 0045)
      - run: rustup toolchain install --no-self-update
      - name: Every enforced layer on macOS (tools/check.sh)
        run: tools/check.sh
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - name: Every test five times next to busy processes (tools/stress-tests.sh)
        run: tools/stress-tests.sh 5
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # llvm-tools is for this job only: it is added to the pinned Rust, not named in rust-toolchain.toml
      - run: |
          rustup toolchain install --no-self-update
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - name: Lines of each crate that the tests run
        run: |
          {
            echo "### Lines the tests run"
            echo
            echo "| Crate | Lines | Run by the tests |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for c in hal dsp ui fpgad; do
            (cd "$c" && cargo llvm-cov --locked --summary-only --json > "$RUNNER_TEMP/$c.json")
            jq -r --arg c "$c" '.data[0].totals.lines | "| \($c) | \(.count) | \(.percent * 10 | round / 10) % |"' \
              "$RUNNER_TEMP/$c.json" | tee -a "$GITHUB_STEP_SUMMARY"
          done
  # The newest stable Rust against the tree, which builds with the release rust-toolchain.toml names (ADR 0045).
  # RUSTUP_TOOLCHAIN goes before that file. A failure here means the next bump needs a fix; nothing else is red.
  # To bump the pin: set `channel` in rust-toolchain.toml to the new release, run tools/check.sh, fix what it
  # finds (a new Clippy lint, a changed rustfmt), all in one pull request.
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          rustup toolchain install stable --no-self-update --profile minimal --component rustfmt,clippy
          --target aarch64-unknown-linux-musl
      - name: Every enforced layer with the newest stable Rust (tools/check.sh)
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          newest=$(rustc --version | cut -d' ' -f2)
          echo "pinned $pinned, newest stable $newest"
          tools/check.sh
          [ "$pinned" = "$newest" ] || echo "::notice::Rust $newest passes; rust-toolchain.toml pins $pinned"
  image:
    # not for a pull request: the workflow Image runs by itself when its file changes
    if: github.event_name != 'pull_request'
    # GitHub checks the permissions of every job of a called workflow when the run starts, the skipped ones too:
    # image.yml's draft-release asks for contents: write, so the call must allow it, or the run does not start. The
    # jobs of image.yml keep its own contents: read; draft-release runs only for a tag, never here.
    permissions:
      contents: write
    uses: ./.github/workflows/image.yml
    with:
      sims: true
  report:
    needs: [macos, stress, coverage, image, canary]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: An issue for the failed run
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS: ${{ needs.macos.result }}
          STRESS: ${{ needs.stress.result }}
          COVERAGE: ${{ needs.coverage.result }}
          IMAGE: ${{ needs.image.result }}
          CANARY: ${{ needs.canary.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The weekly run of $(date -u +%Y-%m-%d) failed: macos $MACOS, stress $STRESS, coverage $COVERAGE,
          image $IMAGE, canary $CANARY (the newest stable Rust, not the one rust-toolchain.toml names).

          $RUN"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"Weekly run failed\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Weekly run failed" --label type/ci --body "$body"
          fi
