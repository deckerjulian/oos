# The whole image on Linux, as a release is built: kernel, initramfs, boot image, update package, USB install file.
# Twice: on an arm64 runner (natively, the same compiler as on a Mac with Apple silicon) and on an x86-64 runner (cross
# compiler for the kernel and oos-hw, QEMU for the arm64 containers). The last job compares what the two put into the
# image (tools/image-manifest.py: kernel, DTB, every file of the initramfs) and fails when they differ, apart from
# the programs built from the OOS source (see the job). The packages themselves hold the build time and differ always.
# The package is signed with the community key of the repository (keys/), as every build without a key of its own.
name: Image
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # by hand only works from the default branch: on any branch it runs when this file changes (tags ignore paths)
    branches: ['**']
    paths: ['.github/workflows/image.yml']
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: QEMU for the arm64 containers
        if: runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Rust
        run: |
          command -v rustup >/dev/null || { curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal && rustup target add aarch64-unknown-linux-musl
      - name: Kernel source (from the latest release, kernel/base.sha256 checks it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'linux-6.12.115-base.tar.xz' --dir kernel/src
      - name: Kernel
        run: kernel/build-base.sh
      - name: Image
        run: boot/build-dev-image.sh
      - name: Manifest
        run: |
          python3 -I tools/image-manifest.py kernel/out/base/Image boot/out/oos-dho900.dtb boot/out/initramfs.cpio.gz > manifest.txt
          {
            echo '```'
            cat kernel/out/base/kernel.release boot/out/busybox.version boot/out/oos-dev.img.sha256
            grep '  kernel/' manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ runner.arch }}
          path: manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: oos-image-${{ runner.arch }}
          path: |
            boot/out/oos-dev.img
            boot/out/oos-dev.img.sha256
            boot/out/oos-dev.oosupd
            boot/out/*.GEL
            boot/out/busybox.version
            kernel/out/base/SHA256SUMS
            kernel/out/base/config
          if-no-files-found: error
  compare:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
      # Strict for everything the cross compiler and the containers make: kernel, DTB, modules, busybox,
      # wpa_supplicant, e2fsck, scripts. The programs built from the OOS source only get a notice: Cargo mixes the host
      # into its crate hashes (rustc -vV says "host: ..."), which ends up in the symbol names and the code layout, and
      # the distribution's native gcc and its cross gcc are different builds with different C libraries (oos-hw).
      - name: arm64 and x86-64 builds the same
        run: |
          own='  initramfs/bin/oos-(hw|ui|fpgad|update)$'
          for a in ARM64 X64; do
            grep -Ev "$own" manifest-$a/manifest.txt > strict-$a.txt
            grep -E "$own" manifest-$a/manifest.txt > own-$a.txt || true
          done
          if ! diff -u own-ARM64.txt own-X64.txt > own.txt; then
            { echo "### Own programs differ between the hosts (expected, not checked)"; echo '```diff'; cat own.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::the programs built from the OOS source differ between arm64 and x86-64 (host in the crate hashes, different gcc builds)"
          fi
          if diff -u strict-ARM64.txt strict-X64.txt > strict.txt; then
            echo "arm64 and x86-64: kernel, DTB and all other files of the initramfs the same ($(wc -l < strict-ARM64.txt) entries)" >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "### arm64 (-) and x86-64 (+) differ"; echo '```diff'; cat strict.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat strict.txt
            exit 1
          fi
