# The whole image on Linux, as a release is built: kernel, initramfs, boot image, update package, USB install file.
# One build, on an arm64 runner (natively, the same compiler as on an arm64 host): for a tag, by hand, and when this
# file changes. The package is signed with the community key of the repository (keys/), as every build without a key
# of its own.
#
# By hand with `both_hosts`: also on an x86-64 runner (cross compiler for the kernel and oos-hw, QEMU for the arm64
# containers, which takes hours), and a last job compares what the two put into the image (tools/image-manifest.py:
# kernel, DTB, every file of the initramfs) and fails when they differ, apart from the programs built from the OOS
# source (see the job). That is a check of the build, not a part of a release: a release needs one image.
#
# With `sims` (the weekly run asks for it): the simulations run on what was built (tools/check.sh sim).
#
# For a tag `vX.Y.Z` the last job drafts the release: the image, the update package, the install file, SHA256SUMS
# and the changelog of that version. A draft, not a publication.
name: Image
on:
  workflow_dispatch:
    inputs:
      both_hosts:
        description: Also build on x86-64 and compare the two images (takes hours)
        type: boolean
        default: false
      sims:
        description: Run the simulations on what was built (tools/check.sh sim)
        type: boolean
        default: false
  # the weekly run
  workflow_call:
    inputs:
      both_hosts:
        type: boolean
        default: false
      sims:
        type: boolean
        default: false
  push:
    tags: ['v*']
    # by hand only works from the default branch: on any branch it runs when this file changes (tags ignore paths)
    branches: ['**']
    paths: ['.github/workflows/image.yml']
# the token can only read (it fetches the kernel source from a release); actions are named by their commit
permissions:
  contents: read
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        # one build; a second one on x86-64 only when it was asked for
        runner: ${{ fromJSON(inputs.both_hosts && '["ubuntu-24.04-arm","ubuntu-24.04"]' || '["ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    # x86-64: the arm64 containers (busybox, kexec-tools, Mesa for the GPU helper) run through QEMU, which takes hours
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: QEMU for the arm64 containers
        if: runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Rust
        run: |
          # rustup without a Rust of its own: the tree's is the one rust-toolchain.toml names, with the scope's target
          # (ADR 0045)
          if ! command -v rustup >/dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install --no-self-update
      - name: Kernel source (from the latest release, kernel/base.sha256 checks it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'linux-6.12.115-base.tar.xz' --dir kernel/src
      - name: Kernel
        run: kernel/build-base.sh
      # the downloads of rootfs/deps.lock and Mesa's build (hours under QEMU). The key follows what they are made from;
      # an older cache is a start, its stamps (rootfs/deps.sh) say which part is built again
      - name: Cache of the downloads and Mesa
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            rootfs/out/*.tar.*
            rootfs/out/*.patch
            rootfs/out/mesa
            rootfs/out/mesa.stamp
          key: rootfs-out-${{ runner.arch }}-${{ hashFiles('rootfs/deps.lock', 'rootfs/deps.sh', 'rootfs/build-*.sh', 'gpu/build.sh', 'tools/lib/docker.sh') }}
          restore-keys: rootfs-out-${{ runner.arch }}-
      - name: Image
        run: boot/build-dev-image.sh
      - name: Manifest
        run: |
          python3 -I tools/image-manifest.py kernel/out/base/Image boot/out/oos-dho900.dtb boot/out/initramfs.cpio.gz > manifest.txt
          {
            echo '```'
            cat kernel/out/base/kernel.release boot/out/busybox.version boot/out/oos-dev.img.sha256
            grep '  kernel/' manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-${{ runner.arch }}
          path: manifest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oos-image-${{ runner.arch }}
          path: |
            boot/out/oos-dev.img
            boot/out/oos-dev.img.sha256
            boot/out/oos-dev.oosupd
            boot/out/*.GEL
            boot/out/busybox.version
            kernel/out/base/SHA256SUMS
            kernel/out/base/config
          if-no-files-found: error
      # After the image: its scripts and programs in containers and virtual machines, without a scope. From the
      # weekly run or by hand with `sims`, and when this file changes on a branch (a test of this step); never for a
      # tag: a release is not held up by them.
      - name: Simulations (tools/check.sh sim)
        if: >-
          runner.arch == 'ARM64' &&
          (inputs.sims || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')))
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          tools/check.sh sim
  compare:
    needs: image
    if: inputs.both_hosts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: manifest-*
      # Strict for everything the cross compiler and the containers make: kernel, DTB, modules, busybox,
      # wpa_supplicant, e2fsck, scripts. The programs built from the OOS source only get a notice: Cargo mixes the host
      # into its crate hashes (rustc -vV says "host: ..."), which ends up in the symbol names and the code layout, and
      # Ubuntu's native gcc and its cross gcc are different builds with different C libraries (oos-hw).
      - name: arm64 and x86-64 builds the same
        run: |
          own='  initramfs/bin/oos-(hw|ui|fpgad|update)$'
          for a in ARM64 X64; do
            grep -Ev "$own" manifest-$a/manifest.txt > strict-$a.txt
            grep -E "$own" manifest-$a/manifest.txt > own-$a.txt || true
          done
          if ! diff -u own-ARM64.txt own-X64.txt > own.txt; then
            { echo "### Own programs differ between the hosts (expected, not checked)"; echo '```diff'; cat own.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::the programs built from the OOS source differ between arm64 and x86-64 (host in the crate hashes, different gcc builds)"
          fi
          if diff -u strict-ARM64.txt strict-X64.txt > strict.txt; then
            echo "arm64 and x86-64: kernel, DTB and all other files of the initramfs the same ($(wc -l < strict-ARM64.txt) entries)" >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "### arm64 (-) and x86-64 (+) differ"; echo '```diff'; cat strict.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat strict.txt
            exit 1
          fi
  # For a tag `vX.Y.Z`: a DRAFT of the release with what was built here, its checksums and the changelog of that
  # version. Nothing is published: the maintainer looks at the draft, adds the sources that a release carries
  # (tools/release-sources.sh names them, and the notes of the draft list them), and publishes it.
  draft-release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oos-image-ARM64
          path: built
      - name: The files of the release, their checksums, the notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          # the tag is the version of the crates
          for c in hal dsp ui fpgad; do
            grep -qx "version = \"$version\"" "$c/Cargo.toml" || {
              echo "::error::$c/Cargo.toml is not at version $version"
              exit 1
            }
          done
          mkdir release
          cp built/boot/out/oos-dev.img "release/oos-$version.img"
          cp built/boot/out/oos-dev.oosupd "release/oos-$version.oosupd"
          cp built/boot/out/*.GEL release/
          (cd release && sha256sum -- * > SHA256SUMS)
          {
            # the section of this version in the changelog
            awk -v v="## $version" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md
            echo
            echo "---"
            echo
            echo "Built by CI from the tag, on arm64, signed with the community key of the repository."
            echo "Still to add before this draft is published, the sources a release carries:"
            echo
            echo '```'
            tools/release-sources.sh list
            echo '```'
          } > notes.md
          cat release/SHA256SUMS
      - name: The draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::the release $TAG exists already: nothing is changed; the files are in the artifact"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "OOS ${TAG#v}" --notes-file notes.md release/*
