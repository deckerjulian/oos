# Tests without hardware. Tests that need the calibration files of a real unit skip themselves.
# The checks are tools/check.sh, the same command a contributor runs (docs/adr/process/0020): every enforced layer, in
# the order of the script. fmt and clippy run as well but do not fail the job until the rollout of ADR 0016 and
# ADR 0017 makes them enforced layers of the script. A pull request is also compared with its base (job compare).
#
# What keeps the workflow itself safe: the token can only read; an action is named by the commit it was reviewed at
# (the release in the comment), not by a tag that can be moved; the checkout leaves no credentials behind for later
# steps; every job has a time limit. A pull request's code runs here without secrets.
name: CI
on:
  # a branch is tested through its pull request; a push only on main, so a commit is not tested twice
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# a new push to a pull request ends the run of the push before it; runs on main are never cut short
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the sign-off check reads every commit of a pull request
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
          persist-credentials: false
      # Dependabot cannot sign off: the person who merges its pull request signs off the squashed commit
      - name: Every commit is signed off (ADR 0026)
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: .\+ <.\+>$'; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no Signed-off-by line (git commit -s, ADR 0026)"
              bad=1
            fi
          done
          exit $bad
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            hal -> target
            dsp -> target
            ui -> target
            fpgad -> target
      - name: Host checks (tools/check.sh, every enforced layer)
        run: tools/check.sh
      - name: Format (ADR 0016, not yet enforced)
        continue-on-error: true
        run: tools/check.sh fmt
      - name: Clippy (ADR 0017, not yet enforced)
        continue-on-error: true
        run: tools/check.sh clippy
  # What a pull request does to the pictures and to the register sequences, against the commit it is merged onto
  # (ADR 0014, ADR 0032). It reports; it fails only when the comparison cannot be made, or when the pull request says
  # "Behaviour: unchanged" and something differs. The pull request's code runs here without secrets, like in `test`.
  compare:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the pull request merged into its base: the first parent of that commit is the base
          fetch-depth: 2
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Pictures and register sequences against the base (tools/compare-base.sh)
        id: compare
        run: |
          rc=0
          tools/compare-base.sh HEAD^1 || rc=$?
          [ ! -f ui/target/compare-base/summary.md ] || cat ui/target/compare-base/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "differs=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -le 1 ]
      - name: Keep what differs
        if: steps.compare.outputs.differs == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compare-base
          path: |
            ui/target/compare-base/summary.md
            ui/target/compare-base/pictures.txt
            ui/target/compare-base/registers.diff
            ui/target/compare-base/differing
      - name: A pull request that says it leaves behaviour unchanged changes nothing
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          DIFFERS: ${{ steps.compare.outputs.differs }}
        run: |
          # read now, not from the event: the text may have been edited since this run was started
          body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if printf '%s\n' "$body" | tr -d '\r' | grep -qiE '^\**Behaviou?r:\** *unchanged'; then
            if [ "$DIFFERS" = 1 ]; then
              echo "::error::the pull request says 'Behaviour: unchanged', but a picture or a register sequence differs"
              exit 1
            fi
            echo "the pull request says 'Behaviour: unchanged', and nothing differs"
          elif [ "$DIFFERS" = 1 ]; then
            echo "::notice::pictures or register sequences differ from the base; the pull request text says why"
          else
            echo "nothing differs"
          fi
