# Tests without hardware. Tests that need the calibration files of a real unit skip themselves.
# The checks are tools/check.sh, the same command a contributor runs (docs/adr/process/0020): every enforced layer, in
# the order of the script. fmt and clippy run as well but do not fail the job until the rollout of ADR 0016 and
# ADR 0017 makes them enforced layers of the script.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # the sign-off check reads every commit of a pull request
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
      - name: Every commit is signed off (ADR 0026)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: .\+ <.\+>$'; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no Signed-off-by line (git commit -s, ADR 0026)"
              bad=1
            fi
          done
          exit $bad
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hal -> target
            dsp -> target
            ui -> target
            fpgad -> target
      - name: Host checks (tools/check.sh, every enforced layer)
        run: tools/check.sh
      - name: Format (ADR 0016, not yet enforced)
        continue-on-error: true
        run: tools/check.sh fmt
      - name: Clippy (ADR 0017, not yet enforced)
        continue-on-error: true
        run: tools/check.sh clippy
