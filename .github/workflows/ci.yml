# Tests without hardware. Tests that need the calibration files of a real unit skip themselves.
# The checks are tools/check.sh, the same command a contributor runs (docs/adr/process/0020): every enforced layer, in
# the order of the script. fmt and clippy run as well but do not fail the job until the rollout of ADR 0016 and
# ADR 0017 makes them enforced layers of the script.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # the sign-off check reads every commit of a pull request
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
      # the commits of a standing agent (a copilot/ branch of this repository) carry no sign-off: the person who
      # merges signs off the squashed commit (ADR 0034)
      - name: Every commit is signed off (ADR 0026)
        if: >-
          github.event_name == 'pull_request' &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'copilot/'))
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: .\+ <.\+>$'; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no Signed-off-by line (git commit -s, ADR 0026)"
              bad=1
            fi
          done
          exit $bad
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hal -> target
            dsp -> target
            ui -> target
            fpgad -> target
      - name: Host checks (tools/check.sh, every enforced layer)
        run: tools/check.sh
      - name: Format (ADR 0016, not yet enforced)
        continue-on-error: true
        run: tools/check.sh fmt
      - name: Clippy (ADR 0017, not yet enforced)
        continue-on-error: true
        run: tools/check.sh clippy
  # A standing agent does not change the rules, the checks, what decides how the scope starts, or the register
  # sequences (ADR 0034). This job runs from the workflow file of the pull request itself: it helps the reviewer, it
  # does not replace the look at what a pull request changes under .github/.
  agent-paths:
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'copilot/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # the pull request merged into its base: the first parent of that commit is the base
          fetch-depth: 2
      - name: No file an agent must not change (tools/agent-paths.sh)
        run: |
          if ! git diff --name-only HEAD^1 HEAD | tools/agent-paths.sh > /tmp/paths; then
            sed 's/^/::error::an agent must not change /' /tmp/paths
            exit 1
          fi
