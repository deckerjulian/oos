# Tests without hardware. Tests that need the calibration files of a real unit skip themselves.
# The checks are tools/check.sh, the same command a contributor runs (docs/adr/process/0020): every enforced layer.
# Here the layers run next to each other, in jobs of their own, and in a pull request only the parts its changes can
# reach (tools/ci-parts.sh, ADR 0040): a change of the tools or the documents builds nothing, one of fpgad does not
# run the tests of ui. A push to main runs every part. The job `test` at the end is the one required check: it passes
# when all of them passed. clippy runs as well, in the job `advice`, and does not fail
# it until the rollout of ADR 0017. A pull request is also compared with its base (job compare).
#
# A pull request that only changes documents or host tools runs the job `files` and skips the rest.
#
# What keeps the workflow itself safe: the token can only read; an action is named by the commit it was reviewed at
# (the release in the comment), not by a tag that can be moved; the checkout leaves no credentials behind for later
# steps; every job has a time limit. A pull request's code runs here without secrets.
name: CI
on:
  # a branch is tested through its pull request; a push only on main, so a commit is not tested twice
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# a new push to a pull request ends the run of the push before it; runs on main are never cut short
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The checks that need no compiler, and what the pull request changes.
  files:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.what.outputs.matrix }}
      compare: ${{ steps.what.outputs.compare }}
      scope: ${{ steps.what.outputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the sign-off check and the list of changed files read every commit of a pull request
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
          persist-credentials: false
      # Dependabot cannot sign off: the squashed commit carries the maintainer's sign-off (ADR 0038)
      - name: Every commit is signed off (ADR 0026)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: .\+ <.\+>$'; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no Signed-off-by line (git commit -s, ADR 0026)"
              bad=1
            fi
          done
          exit $bad
      # a finding fails the pull request: a pushed commit stays readable, so the value has to go out of the commits
      # (or, for one that is meant to be public, onto tools/privacy-allow.txt in the same pull request)
      - name: Nothing of a person or a unit in the new lines and messages (tools/privacy-scan.py)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! python3 -I tools/privacy-scan.py "$BASE..$HEAD" > /tmp/privacy; then
            sed 's/^/::error::privacy: /' /tmp/privacy
            exit 1
          fi
          cat /tmp/privacy
      - name: What the changes can reach (tools/ci-parts.sh)
        id: what
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # on main every part runs; in a pull request the parts its changed files reach. In doubt: every part.
          if [ -n "$BASE" ] && names=$(git diff --name-only "$BASE...$HEAD") && [ -n "$names" ]; then
            printf '%s\n' "$names" | tools/ci-parts.sh > /tmp/parts
          else
            tools/ci-parts.sh --all > /tmp/parts
          fi
          cat /tmp/parts | tee -a "$GITHUB_OUTPUT"
      - name: Files, script syntax, the tests of the host tools
        run: tools/check.sh text syntax test:tools
  # The layers with a compiler, next to each other: the parts tools/ci-parts.sh chose. Together with `files` they are
  # every enforced layer.
  check:
    needs: files
    if: needs.files.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.files.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup target add aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.cache }}
          # pull requests read the caches of main and write none
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            hal -> target
            dsp -> target
            ui -> target
            fpgad -> target
      - name: tools/check.sh ${{ matrix.layers }}
        env:
          LAYERS: ${{ matrix.layers }}
        run: tools/check.sh $LAYERS
  # clippy and the numbers that only go down: shown, not yet enforced
  advice:
    needs: files
    if: needs.files.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: advice
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            hal -> target
            dsp -> target
            ui -> target
            fpgad -> target
      - name: Clippy (ADR 0017, not yet enforced)
        continue-on-error: true
        run: tools/check.sh clippy
      - name: Numbers that only go down (ADR 0037, not yet enforced)
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # a number the pull request raised in the file is a notice for the reviewer, whatever the check says
          if [ -n "$BASE" ]; then
            git fetch --quiet --depth 1 origin "$BASE" || true
            tools/ratchet.sh --base "$BASE" | sed 's/^/::notice::tools\/ratchet.txt, /'
          fi
          tools/check.sh ratchet
  # The one required check: every enforced layer passed, or was skipped for a pull request of documents only.
  test:
    needs: [files, check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "files and check: $RESULTS"
          for r in $RESULTS; do
            case $r in
              success | skipped) ;;
              *) echo "::error::a job ended as $r"; exit 1 ;;
            esac
          done
  # What a pull request does to the pictures and to the register sequences, against the commit it is merged onto
  # (ADR 0014, ADR 0032). It reports; it fails only when the comparison cannot be made, or when the pull request says
  # "Behaviour: unchanged" and something differs. The pull request's code runs here without secrets, like in `test`.
  compare:
    needs: files
    if: github.event_name == 'pull_request' && needs.files.outputs.compare == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the pull request merged into its base: the first parent of that commit is the base
          fetch-depth: 2
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      # Both sides are built the same way, so the comparison does not need the release's slow link step: without it a
      # build of oos-ui takes a third of the time (measured on 2026-11-17: 20 s instead of 68 s on a laptop).
      - name: Pictures and register sequences against the base (tools/compare-base.sh)
        id: compare
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
        run: |
          rc=0
          tools/compare-base.sh HEAD^1 || rc=$?
          [ ! -f ui/target/compare-base/summary.md ] || cat ui/target/compare-base/summary.md >> "$GITHUB_STEP_SUMMARY"
          # how many lines of code the pull request adds or removes: to see, not a gate
          if [ -d ui/target/compare-base/tree ]; then
            { echo; python3 -I tools/code-size.py ui/target/compare-base/tree .; } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "differs=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -le 1 ]
      - name: Keep what differs
        if: steps.compare.outputs.differs == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compare-base
          path: |
            ui/target/compare-base/summary.md
            ui/target/compare-base/pictures.txt
            ui/target/compare-base/registers.diff
            ui/target/compare-base/differing
      - name: A pull request that says it leaves behaviour unchanged changes nothing
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          DIFFERS: ${{ steps.compare.outputs.differs }}
        run: |
          # read now, not from the event: the text may have been edited since this run was started
          body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if printf '%s\n' "$body" | tr -d '\r' | grep -qiE '^\**Behaviou?r:\** *unchanged'; then
            if [ "$DIFFERS" = 1 ]; then
              echo "::error::the pull request says 'Behaviour: unchanged', but a picture or a register sequence differs"
              exit 1
            fi
            echo "the pull request says 'Behaviour: unchanged', and nothing differs"
          elif [ "$DIFFERS" = 1 ]; then
            echo "::notice::pictures or register sequences differ from the base; the pull request text says why"
          else
            echo "nothing differs"
          fi
  # Whether the programs that run on the scope change at all (ADR 0041): oos-ui and oos-fpgad for the scope, built
  # from the pull request and from its base in this one folder, compared byte for byte. Equal programs let the status
  # `unit` pass without a run on a unit (tools/pr-gate.sh); a pull request whose programs differ keeps the artifact
  # `scope-binaries-differ`, and needs the run. Only for a pull request that touches a path of a crate that a unit
  # proves, and nothing of the image. Like `compare`, it reports and does not fail for a difference.
  scope:
    needs: files
    if: github.event_name == 'pull_request' && needs.files.outputs.scope == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the pull request merged into its base: the first parent of that commit is the base
          fetch-depth: 2
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-unknown-linux-musl
      - name: The programs for the scope against the base (tools/scope-binaries.sh)
        id: scope
        run: |
          rc=0
          tools/scope-binaries.sh HEAD^1 > /tmp/scope.txt || rc=$?
          cat /tmp/scope.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo "differs=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -le 1 ]
      - name: Keep the sign that they differ
        if: steps.scope.outputs.differs == '1'
        run: echo "the programs for the scope differ from the base's" > /tmp/scope-binaries-differ.txt
      - if: steps.scope.outputs.differs == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scope-binaries-differ
          path: /tmp/scope-binaries-differ.txt
