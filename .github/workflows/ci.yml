# Tests without hardware. Tests that need the calibration files of a real unit skip themselves.
# Every step is a layer of tools/check.sh, so a contributor runs the same checks with `tools/check.sh`
# (docs/adr/process/0020). fmt and clippy join with the rollout of ADR 0016 and ADR 0017.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add aarch64-unknown-linux-musl
      - name: Files (licence line, line ends, trailing spaces)
        run: tools/check.sh text
      - name: Python and shell syntax
        run: tools/check.sh syntax
      - name: Tests
        run: tools/check.sh test
      - name: Target build
        run: tools/check.sh target
      - name: Decoder features
        run: tools/check.sh decoders
