# The environment of GitHub Copilot's cloud agent (docs/adr/process/0034): what the agent needs to run tools/check.sh
# and tools/compare-base.sh before it opens a pull request. GitHub runs this job before the agent starts and only
# takes it from the default branch; the job must have this name. It runs here too when this file changes, as a test.
name: Copilot setup steps
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/compare-base.sh builds the commit the branch started from
          fetch-depth: 0
      - name: Rust with the scope's target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add aarch64-unknown-linux-musl
      - name: Crates, while the network is still open
        run: |
          for c in hal dsp ui fpgad; do
            (cd "$c" && cargo fetch --locked)
          done
