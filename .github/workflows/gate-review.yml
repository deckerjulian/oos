# The gate after a review of a fork's pull request (#333). A review or a resolved comment starts gate.yml, but on a
# fork's pull request that run gets a token that cannot write labels or statuses, and gate.yml leaves its job out
# there. This workflow starts when that run is done: `workflow_run` runs on main, with the scripts as they are on main
# and a token that may write, and answers every open pull request as the scheduled run does. So `owner` and `review`
# follow an approval or a resolved thread within a minute or two instead of the next quarter of an hour.
#
# No code of the pull request runs here, as in gate.yml.
name: Gate after a review
on:
  workflow_run:
    workflows: [Gate]
    types: [completed]
permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write
concurrency:
  group: gate-all
jobs:
  gate:
    if: >-
      github.repository == 'dekajoule/oos' &&
      startsWith(github.event.workflow_run.event, 'pull_request_review')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tools
          persist-credentials: false
      - name: waited, owner, unit, review of every open pull request (tools/pr-gate.sh --all)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/pr-gate.sh --all
