# Asks GitHub to merge a pull request by itself once every required check has passed (docs/adr/process/0038), for
# pull requests from branches of this repository by the maintainer and by Dependabot. A pull request from a fork and
# one of an agent (a copilot/ branch) never get it here: the maintainer merges those.
#
# It does nothing until three things are set by the maintainer: the repository allows auto-merge, the variable
# AUTO_MERGE is `on`, and the secret MAINTAINER_TOKEN holds a token of the maintainer (contents and pull requests:
# read and write). The token is the maintainer's because a merge made with the workflow's own token would start no
# workflow on main. Switch it on only after `waited`, `owner` and `unit` are required checks of main: before that,
# a pull request would be merged as soon as `test` is green.
#
# No code of the pull request runs here; the job reads its title and commit messages.
name: Auto-merge
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions: {}
jobs:
  enable:
    if: >-
      github.repository == 'dekajoule/oos' && vars.AUTO_MERGE == 'on' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !startsWith(github.event.pull_request.head.ref, 'copilot/') &&
      contains(fromJSON('["dekajoule", "dependabot[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ask for the merge
        env:
          GH_TOKEN: ${{ secrets.MAINTAINER_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          # the sign-off of the person who answers for the merge (ADR 0026, ADR 0034): "Name <address>"
          SIGNOFF: ${{ vars.MAINTAINER_SIGNOFF }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$SIGNOFF" ]; then
            echo "::notice::no MAINTAINER_TOKEN or MAINTAINER_SIGNOFF: nothing asked"
            exit 0
          fi
          # the squashed commit: the title, the messages of the commits, and the sign-off if none of them has it
          body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json commits \
            --jq '[.commits[] | if .messageBody == "" then .messageHeadline else .messageBody end] | join("\n\n")')
          case $body in
            *"Signed-off-by: $SIGNOFF"*) ;;
            *) body="$body

          Signed-off-by: $SIGNOFF" ;;
          esac
          # a new push: ask again, with the messages as they are now
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto 2>/dev/null || true
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --subject "$TITLE (#$PR)" --body "$body"
