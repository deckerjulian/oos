# deps.lock - every source tarball the image builds from, with its pinned version and SHA-256 (docs/fork/deps.md).
# Columns: name, owner, version, sha256, url, and optionally a page that lists the releases where the url's directory
# has no listing (netfilter.org answers 403 there). The fork's build scripts read their lines (rootfs/deps.sh); `upstream:`
# lines are the values upstream's own scripts carry, listed so tools/deps-check.sh covers them too and warns when the
# script and this file differ (those scripts stay untouched for cheap upstream syncs). The url holds the version
# literally: deps-check.sh finds newer releases in its directory listing.
