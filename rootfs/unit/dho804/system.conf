# /etc/oos/system.conf: defaults for /oos/system.conf on this unit (docs/network.md 6, docs/fork/unit-dho804.md).
# A key in /oos/system.conf wins, also with an empty value.
# Inbound only from the home LAN and link-local (a laptop on a direct cable): firewall (oos-firewall) and
# update, MCP, SCPI, VXI-11 (oos-ui). Link-local is not routable.
net.allow = 192.0.2.0/24 169.254.0.0/16
# No unauthenticated root shell on the network (upstream key, read by rcS and oos-ui). Enable with System > Network >
# Remote services > telnet, or `remote.telnet = on` in /oos/system.conf.
remote.telnet = off
# The stock MAC, so the DHCP reservation of the stock system applies.
eth.mac = 02:00:00:00:00:01
