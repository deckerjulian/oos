# /etc/oos/system.conf: defaults for /oos/system.conf on this unit (docs/network.md 6, docs/fork/unit-dho804.md).
# A key in /oos/system.conf wins, also with an empty value.
# Inbound only from the home LAN and link-local (a laptop on a direct cable): firewall (oos-firewall) and
# update, MCP, SCPI, VXI-11 (oos-ui). Link-local is not routable.
net.allow = 192.0.2.0/24 169.254.0.0/16
# SSH on: root with the password the scope makes at its first start, or with a trusted key (docs/network.md 7). Port
# 22 is open only to net.allow above. Off with System > Network > Remote services > SSH, or `remote.ssh = off` in
# /oos/system.conf. This fork ships no telnet.
remote.ssh = on
# The stock MAC, so the DHCP reservation of the stock system applies.
eth.mac = 02:00:00:00:00:01
# xdma transfer completion by MSI instead of the polling threads (poll_mode=1): equal rates, one A53 freer, 20 min
# soak clean on the unit (docs/fork/unit-dho804.md, on-unit session 2026-11-13). Read by oos-fpga-up at bring-up.
xdma.params = poll_mode=0
# Acquisition as measured best on this unit (private RE notes docs/logs/oos_unitlab_20261113.md): batch pipeline,
# the hw thread and deposit workers placed on their cores, the next batch armed while one is decoded. oos-ui reads
# these from here unless /oos/system.conf sets them.
acq.pipeline = batch
perf.place = on
acq.prearm = on
