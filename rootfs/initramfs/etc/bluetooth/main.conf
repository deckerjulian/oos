# bluetoothd on OOS (bin/oos-bt, docs/bluetooth.md): a host for mice and keyboards. Everything not set here is
# BlueZ's default.

[General]
# the scope's name on the network (net.name), as other devices list it; bin/oos-bt puts it in for %h
Name = %h
# major class Computer, minor class Desktop: what a keyboard expects to be paired with
Class = 0x000104
# visible only while System > Bluetooth searches; oos-ui switches it on and off
DiscoverableTimeout = 180
PairableTimeout = 180

[Policy]
# the controller is on as soon as the stick is in
AutoEnable = true
# a paired mouse or keyboard that wakes up connects again by itself
ReconnectAttempts = 7
ReconnectIntervals = 1, 2, 4, 8, 16, 32, 64
