[package]
name = "oos-ui"
version = "0.1.14"
repository = "https://github.com/dekajoule/oos"
edition = "2021"
description = "OOS oscilloscope user interface for the Rigol DHO800/DHO900 (software renderer on DRM/KMS, touch, front panel)"
license = "GPL-2.0-or-later"

# Every decoder is always built in; `decoders.off` in /oos/system.conf (System > Features) leaves some out at run time
# (docs/adr/code/0071).
[dependencies]
libc = "0.2"
oos-hal = { path = "../hal" }
oos-dsp = { path = "../dsp" }
oos-system = { path = "system" }
oos-remote = { path = "remote" }

# the tests use the helpers of oos-system's tests too (a scratch directory, the test switches); the program does not
[dev-dependencies]
# the simulated unit, for the host run of the acquisition loop (ADR 0053); the program is built without it
oos-hal = { path = "../hal", features = ["sim"] }
oos-system = { path = "system", features = ["testkit"] }
oos-remote = { path = "remote", features = ["testkit"] }

# oos-ui and the crates its layers became (ADR 0064): one lock file, one target directory, one `cargo test --workspace`
[workspace]
members = ["remote", "system"]
# tools/compare-base.sh checks the base out below target/: its ui/ is a tree of its own, not a member
exclude = ["target"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

# Keep long-reference DSP and Eye analysis responsive in the source watcher.
# The UI itself keeps the normal fast incremental development build.
[profile.dev.package.oos-dsp]
opt-level = 2

# The tests run optimised a little (docs/adr/process/0040): the tests of updates and pictures take seconds instead
# of minutes. Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1

# The lints allowed for the whole crate, each with its reason (docs/adr/process/0017). The same two in every crate;
# `too_many_arguments` is for the step builders of hal and not allowed here (docs/adr/process/0048).
[lints.clippy]
# `!(dt > 0.0)` is meant: it is also true for NaN, and the signal paths rely on that
neg_cmp_op_on_partial_ord = "allow"
# index loops over several buffers of the same length read better than zipped iterators
needless_range_loop = "allow"
