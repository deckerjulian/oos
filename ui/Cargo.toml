[package]
name = "oos-ui"
version = "0.1.13"
repository = "https://github.com/dekajoule/oos"
edition = "2021"
description = "OOS oscilloscope user interface for the Rigol DHO800/DHO900 (software renderer on DRM/KMS, touch, front panel)"
license = "GPL-2.0-or-later"

# Decoders beyond the seven core ones (UART, I2C, SPI, CAN, LIN, Parallel, C-PHY, always built), one feature per
# file in src/protocols. All are on by default; a build without some: `--no-default-features --features "..."`, or
# OOS_DECODERS / OOS_DECODERS_OFF with build.sh and boot/build-dev-image.sh (tools/decoder-features.sh).
[features]
default = ["decoders"]
decoders = ["dec-dmx512", "dec-spdif", "dec-usbpd", "dec-dcc", "dec-linecode", "dec-serial", "dec-onewire", "dec-debug", "dec-qspi", "dec-i3c", "dec-vehicle", "dec-avionics", "dec-i2s", "dec-usb"]
dec-dmx512 = []
dec-spdif = []
dec-usbpd = []
dec-dcc = []
dec-linecode = []
dec-serial = []
dec-onewire = []
dec-debug = []
dec-qspi = []
dec-i3c = []
dec-vehicle = []
dec-avionics = []
dec-i2s = []
dec-usb = []

[dependencies]
libc = "0.2"
oos-hal = { path = "../hal" }
oos-dsp = { path = "../dsp" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

# Keep long-reference DSP and Eye analysis responsive in the source watcher.
# The UI itself keeps the normal fast incremental development build.
[profile.dev.package.oos-dsp]
opt-level = 2

# The lints allowed for the whole crate, each with its reason (docs/adr/process/0017). The same list in every crate.
[lints.clippy]
# `!(dt > 0.0)` is meant: it is also true for NaN, and the signal paths rely on that
neg_cmp_op_on_partial_ord = "allow"
# index loops over several buffers of the same length read better than zipped iterators
needless_range_loop = "allow"
# step builders take the fields of one register; a struct for each would only move the list
too_many_arguments = "allow"
