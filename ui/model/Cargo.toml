[package]
name = "oos-model"
version = "0.0.0"
repository = "https://github.com/dekajoule/oos"
edition = "2021"
description = "OOS: the model of oos-ui (what the user has set, its ladders and number formats) and the settings table"
license = "GPL-2.0-or-later"
publish = false

# `testkit`: what the tests of oos-ui need of the model and the settings table (the docs lines of a row, the rows of
# each group, a changed value of a row). oos-ui turns it on for its tests only (its dev-dependency); the program for
# the scope is built without.
[features]
testkit = []

[dependencies]
oos-hal = { path = "../../hal" }
oos-dsp = { path = "../../dsp" }

# The lints allowed for the whole crate, each with its reason (docs/adr/process/0017). The same two in every crate.
[lints.clippy]
# `!(dt > 0.0)` is meant: it is also true for NaN, and the signal paths rely on that
neg_cmp_op_on_partial_ord = "allow"
# index loops over several buffers of the same length read better than zipped iterators
needless_range_loop = "allow"
